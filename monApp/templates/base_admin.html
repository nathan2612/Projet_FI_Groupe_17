<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Administration{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base_admin.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<body class="admin-body">
    
    {% block styles %}{% endblock %}
<body>
    <div class="sidebar">
        <h2><a href="{{ url_for('admin_index') }}">Administration</a></h2>
        <nav class="nav-links">
            <ul>
                <li {% if request.endpoint == 'admin_index' %}class="active"{% endif %}>
                    <a href="{{ url_for('admin_index') }}"><i class="fas fa-tachometer-alt"></i> Tableau de bord</a>
                </li>
                <li {% if request.endpoint == 'admin_stock' %}class="active"{% endif %}>
                    <a href="{{ url_for('admin_stock') }}"><i class="fas fa-boxes"></i> Gestion du stock</a>
                </li>
                <li {% if request.endpoint == 'commandes' %}class="active"{% endif %}>
                    <a href="{{ url_for('commandes') }}"><i class="fas fa-receipt"></i> Commandes</a>
                </li>
                <li {% if request.endpoint == 'admin_banni' %}class="active"{% endif %}>
                    <a href="{{ url_for('admin_banni') }}"><i class="fas fa-user-slash"></i> Clients à bannir</a>
                </li>
                <li {% if request.endpoint == 'admin_bannis' %}class="active"{% endif %}>
                    <a href="{{ url_for('admin_bannis') }}"><i class="fas fa-gavel"></i> Clients bannis</a>
                </li>
            </ul>
        </nav>
        <div class="logout-link">
             <a href="{{ url_for('index') }}"><i class="fas fa-sign-out-alt"></i> Retour au site</a>
        </div>
    </div>
    <div class="content">
        {% block main %}{% endblock %}
    </div>
</body>
</html>
