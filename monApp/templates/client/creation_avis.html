{% extends "client/base.html" %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/client/creation_avis.css') }}">
{% endblock %}

{% block main %}
<div class="review-page-wrapper">
    <div class="review-card">
        <div class="review-header">
            <h1>Donnez votre avis</h1>
            <p>Partagez votre expérience avec nous. Votre avis est précieux !</p>
        </div>

        <form action="{{ url_for('creer_avis') }}" method="POST" class="review-form">
            <div class="form-group rating-group">
                <label class="form-label">Votre note</label>
                <div class="rating-stars" style="text-align: center;">
                    <input type="radio" id="star5" name="note" value="5" required><label for="star5" title="5 étoiles">★</label>
                    <input type="radio" id="star4" name="note" value="4"><label for="star4" title="4 étoiles">★</label>
                    <input type="radio" id="star3" name="note" value="3"><label for="star3" title="3 étoiles">★</label>
                    <input type="radio" id="star2" name="note" value="2"><label for="star2" title="2 étoiles">★</label>
                    <input type="radio" id="star1" name="note" value="1"><label for="star1" title="1 étoile">★</label>
                </div>
            </div>

            <div class="form-group">
                <label for="commentaire" class="form-label">Votre commentaire</label>
                <textarea id="commentaire" name="commentaire" rows="6" placeholder="Décrivez votre expérience, ce que vous avez aimé ou moins aimé..." required></textarea>
            </div>

            <div class="publish-info">
                <i class="fas fa-info-circle"></i>
                <span>Votre prénom sera affiché publiquement avec votre avis.</span>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-primary">Publier mon avis</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
