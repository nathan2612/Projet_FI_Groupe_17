<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lancement réussi</title>
    <style>
        :root{--bg:#f6fffa;--card:#ffffff;--accent:#10b981;--text:#0f172a}
        html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
        body{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text)}
        .card{background:var(--card);padding:32px 40px;border-radius:12px;box-shadow:0 10px 30px rgba(2,6,23,0.08);text-align:center;max-width:480px;width:90%}
        .status{display:inline-flex;align-items:center;gap:12px;font-weight:600;color:var(--accent);font-size:18px}
        .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 2px 6px rgba(16,185,129,0.25)}
        p{margin:10px 0 0;color:#374151}
    </style>
</head>
<body>
    <main class="card" role="main" aria-labelledby="title">
        <h1 id="title" class="status"><span class="dot" aria-hidden="true"></span>Lancement réussi</h1>
        <p>Votre application est prête et fonctionne correctement.</p>
    </main>
</body>
</html>
